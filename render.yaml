# Render Blueprint: managed PostgreSQL + Docker web service, deployed from this repo.
databases:
  - name: patients-db
    plan: free
    databaseName: patients
    user: patients

services:
  - type: web
    name: patient-voice-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patients-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
      - key: API_KEY
        sync: false          # optional - set in the dashboard if you want the REST API protected
      - key: SEED_DEMO_DATA
        value: "true"
